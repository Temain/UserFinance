global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: "finance-service"
    static_configs:
      - targets: ["finance-service:8080"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8080"]
